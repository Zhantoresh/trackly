# Internal Nginx for the trackly-web container. Deliberately unaware of the
# /trackly prefix that the university's public Nginx routes this project
# under — that prefix is stripped before requests reach this container, so
# everything here behaves as if the app lives at the domain root.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # FastAPI routes are all declared under /api/... already — forward as-is.
    location /api/ {
        proxy_pass http://trackly-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files, served by the backend's own StaticFiles mount at /files.
    location /files/ {
        proxy_pass http://trackly-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA — anything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
